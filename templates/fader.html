{% set stroke_width = 4 %}
{% set line_stroke_width = 4 %}
{% set big_side = 128  %}
{% set small_side = 40 %}
{% if sideways %}
    <svg style="background-color: #cd00cc" width="{{ big_side + stroke_width + line_stroke_width}}" height="{{ small_side + stroke_width + line_stroke_width}}" title="{{ value }}">
      <rect x="{{ stroke_width }}" y="{{ stroke_width }}" width="{{ big_side }}" rx="1" ry="1" height="{{ small_side }}" stroke="#000000" stroke-width="{{ stroke_width }}" fill="white" />
      <line
              x1="{{ stroke_width + line_stroke_width + (value*(big_side - stroke_width -line_stroke_width ))}}"
              y1="{{ stroke_width + 0.5*stroke_width }}"
              x2="{{ stroke_width + line_stroke_width + (value*(big_side - stroke_width -line_stroke_width))}}"
              y2="{{ small_side + 0.5*stroke_width}}"
              style="stroke:#70fff7;
            stroke-width:{{ line_stroke_width }}"/>
    <title>
         {{ tag }}:{{ value }}
    </title>
    </svg>
{% else %}
    <svg width="150" height="150">
      <rect x="5" y="5" width="40" rx="1" ry="1" height="128" stroke="#000000" stroke-width="4" fill="white" />
      <line x1="5" y1="100" x2="45" y2="100" style="stroke:black;stroke-width:2" />
    </svg>

{% endif %}
