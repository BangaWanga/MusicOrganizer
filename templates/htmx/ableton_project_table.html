

<table>
    <thead>
        <tr>
            {% for head in header %}
                <td>{{ head }}</td>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for track in tracks %}
                <tr class="track-info ">
                    {% for head in header %}
                        <td class="ableton-col-{{ track.color }}">{{ track[head] }} </td>
                    {% endfor %}
                </tr>
        {% endfor %}
    </tbody>
</table>

<style>

th, td {
  border: 1px solid #a1fffd;
  border-radius: 5px;
}

    }
</style>
