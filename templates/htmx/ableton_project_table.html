

<table id="ableton-project-table">
    <thead>
        <tr>
            <td>Name</td>
            <td>Typ</td>
            <td>Pan</td>
            <td>Volume</td>
            <td>Plug-Ins</td>
        </tr>
    </thead>
    <tbody>
        {% for track in tracks %}
                <tr class="track-info ableton-col-{{ track.color }} {{ track.track_type }}"
                {% if not track.is_visible %} style="visibility: collapse;"{% endif %}
                hx-get="/toggle-group-track?track_id={{ track.track_id }}&project_idx={{ project_idx }}"
                    hx-target="#ableton-project-table"
                hx-swap="outerHTML"
                >
                    <td>{{ track.name }} </td>
                    <td>{{ track.track_type }} </td>
                    <td>{{ track.pan }} </td>
                    <td>{{ track.volume }} </td>
                    <td>
                        <ul>
                            {% for plug_in in track.plug_ins %}
                            <li title="{{ plug_in.path }}">{{ plug_in.name }} - vst-version: {{ plug_in.vst_version }} </li>
                            {% endfor %}
                        </ul>
                    </td>
                </tr>
        {% endfor %}
    </tbody>
</table>

<style>

th, td {
  border: 1px solid #a1fffd;
  border-radius: 5px;
}

    .track-info{
    }
</style>
