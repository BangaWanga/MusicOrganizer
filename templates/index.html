<script>

    readNewFiles = function () {
        let files = document.getElementById("files").files;
        for (let file = 0; file < files.length; file++) {

        }
    }
    get_project_paths = function (event) {
        let project_paths = []
        for (const file of event.target.files) {
            project_paths.push(file.webkitRelativePath)
            console.log("GETO ", file,)
        }
        console.log("project_paths:", project_paths);
        return project_paths;
    }
    add_project_paths = function (event) {
        let output = document.getElementById("new-file-path-list");
        for (const file of event.target.files) {
            let item = document.createElement("li");
            item.textContent = file.webkitAbsolutePath;
            console.log("ITEM ", item);
            output.appendChild(item);
        }
    }
    if (typeof bookmarked_element === "undefined") {
        let bookmarked_element = null;

    }
    let selectedDataPoint = null

    setInfobox = function (text, button_id) {
        console.log("setInfobox ", button_id);
        if (!button_id || !document.getElementById(button_id)) {
            return;
        } else {
            new_bookmarked_element = document.getElementById(button_id)
            console.log("Found ELement!: ", button_id);

            new_bookmarked_element.classList.add("active-bookmark");
            if (selectedDataPoint !== null && selectedDataPoint !== undefined) {
                console.log("Removing class from ", selectedDataPoint)
                bookmarked_element = document.getElementById(selectedDataPoint)
                bookmarked_element.classList.remove("active-bookmark");
            }
            selectedDataPoint = button_id;
        }

        htmx.swap('#info-box', text, {swapStyle: 'innerHTML'})
    }

    reload = function () {
        window.location.href = "/reload"
    }
    home = function () {
        window.location.href = "/"
    }
    let selectedFiles = [];
</script>

<style>
    .GroupTrack:hover {
        background-color: chocolate;
    }

    .project-info:hover {

        }

        }

<div id="spinner" class="htmx-indicator"
     style="position: absolute; width: 100%; height: 100%; pointer-events: none; color: firebrick; background-color: #b6b6b6; text-align: center">
    <h1 class="my-indicator"> LOADING... </h1></div>

<div class="card">
    <div class="card-body" style="max-width: 25%; padding-left: 60px;">
        <div class="row">
            <div class="col-md">
                <button class="button" hx-on:click="home()" hx-indicator="#spinner">
                    <span>HOME</span>
                </button>
            </div>
            <div class="col-md">
                <button class="button" hx-on:click="reload()" hx-indicator="#spinner">
                    <span>⟳</span>
                </button>
            </div>
        </div>

    </div>
</div>


<div id="new-project-picker" class="card" style="padding: 60px;">
    <div class="card-header">
        Projektübersicht
    </div>
    <div class="card-body">

        <label for="new-project-path"></label>
        {#
        <form hx-on:change="add_project_paths(event);htmx.ajax('POST', '/project_paths',
            {'swap': 'innerHTML', 'target': '#new-file-path-list', 'values':{'paths': get_project_paths(event)}})">

            <input id="new-project-path" name="files" type="file" webkitdirectory multiple/>
            <input id="submit-new-project-paths" type="submit"/>
        </form>
        #}
        <button class="button" hx-get="/project_paths" hx-swap="none" hx-indicator="#spinner"
                title="Sets a new source directory to load new projects from">Set source directory
        </button>
        <ul id="new-file-path-list">

        </ul>
        <span id="textArea">

        </span>

        <div class="project-table" id="project-table">
            {{ table_template | safe }}
        </div>
        <ul id="bookmarks"
            hx-on::beforeSwap="console.log('WORKS', this, event)"
        >

        </ul>
        <div id="info-box">

        </div>

    </div>

</div>


</body>
