<span>
    Device: {{ name }}
</span>

<h1>Send Note</h1>
<form hx-post="/send_midi_signal" hx-swap="none">
    <div class="form-group">
        <label>Note</label>
        <input type="number" id="note" name="note" min="0" max="127" value="60"/>
    </div>
    <div class="form-group">
        <label>Velocity</label>
        <input type="number" id="velocity" name="velocity" min="0" max="127" value="110"/>
    </div>
    <button type="submit">Senden</button>
    <form id="emit" method="POST" action='#' hx-post="/">
        <input type="text" name="emit_data" id="emit_data" placeholder="Message">
        <input type="submit" value="Echo">
    </form>
</form>

<canvas id="canvas" width="150" height="150">The current time</canvas>
<script>
    let elem = document.getElementById('canvas');
    let elemLeft = elem.offsetLeft + elem.clientLeft;
    let elemTop = elem.offsetTop + elem.clientTop;
    let context = elem.getContext('2d');
    let elements = [];

    function getAngle(mx, my, cx, cy) {
        // Berechne den Winkel zwischen dem Mittelpunkt (cx, cy) und der Mausposition (mx, my)
        const angle = Math.atan2(my - cy, mx - cx);  // Winkel im Bogenmaß
        const angleDegrees = angle * (180 / Math.PI); // Umwandlung in Grad
        const angleDegreesNormalized = (angleDegrees + 360) % 360;  // Normalisieren auf 0 - 360
        return angleDegreesNormalized;
    }

    function getValueFromAngle(angleDegrees) {
        return (angleDegrees / 360) * 100;
    }

    function webSocketConn() {
        // Create WebSocket connection.
        const socket = new WebSocket("ws://localhost:5000");
        console.log(socket.readyState)
        // Connection opened
        socket.addEventListener("open", (event) => {
            socket.send("Hello Server!");
        });

        // Listen for messages
        socket.addEventListener("message", (event) => {
            console.log("Message from server ", event.data);
        });

    }
    webSocketConn();
    // Add event listener for `click` events.
    elem.addEventListener('click', function (event) {
        let x = event.pageX - elemLeft;
        let y = event.pageY - elemTop;
        let angle = getAngle(x, y, 75, 75)
        let angleValue = getValueFromAngle(angle)
        console.log(angleValue)

        // Collision detection between clicked offset and element.


    }, false);

    function clock() {
        const now = new Date();
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        ctx.save();
        ctx.clearRect(0, 0, 150, 150);
        ctx.translate(75, 75);
        ctx.scale(0.4, 0.4);
        ctx.rotate(-Math.PI / 2);
        ctx.strokeStyle = "black";
        ctx.fillStyle = "white";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";

        // Hour marks
        {#        ctx.save();
                for (let i = 0; i < 12; i++) {
                    ctx.beginPath();
                    ctx.rotate(Math.PI / 6);
                    ctx.moveTo(100, 0);
                    ctx.lineTo(120, 0);
                    ctx.stroke();
                }
                ctx.restore();#}

        // Minute marks
        ctx.save();
        ctx.lineWidth = 5;
        for (let i = 0; i < 128; i++) {
            ctx.beginPath();
            ctx.moveTo(117, 0);
            ctx.lineTo(120, 0);
            ctx.stroke();
            ctx.rotate(Math.PI / 64);
        }
        ctx.restore();

        const sec = now.getSeconds();
        // To display a clock with a sweeping second hand, use:
        // const sec = now.getSeconds() + now.getMilliseconds() / 1000;
        const min = now.getMinutes();
        const hr = now.getHours() % 12;

        ctx.fillStyle = "black";

        // Write image description
        canvas.innerText = `The time is: ${hr}:${min}`;

        // Write Hours
        ctx.save();
        ctx.rotate(
            (Math.PI / 6) * hr + (Math.PI / 360) * min + (Math.PI / 21600) * sec,
        );
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(-20, 0);
        ctx.lineTo(80, 0);
        ctx.stroke();
        ctx.restore();

        // Write Minutes
        ctx.save();
        ctx.rotate((Math.PI / 30) * min + (Math.PI / 1800) * sec);
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(-28, 0);
        ctx.lineTo(112, 0);
        ctx.stroke();
        ctx.restore();

        // Write seconds
        ctx.save();
        ctx.rotate((sec * Math.PI) / 30);
        ctx.strokeStyle = "#D40000";
        ctx.fillStyle = "#D40000";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-30, 0);
        ctx.lineTo(83, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2, true);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(95, 0, 10, 0, Math.PI * 2, true);
        ctx.stroke();
        ctx.fillStyle = "rgb(0 0 0 / 0%)";
        ctx.arc(0, 0, 3, 0, Math.PI * 2, true);
        ctx.fill();
        ctx.restore();

        ctx.beginPath();
        ctx.lineWidth = 14;
        ctx.strokeStyle = "#325FA2";
        ctx.arc(0, 0, 142, 0, Math.PI * 2, true);
        ctx.stroke();

        ctx.restore();

        window.requestAnimationFrame(clock);
    }

    window.requestAnimationFrame(clock);

</script>
